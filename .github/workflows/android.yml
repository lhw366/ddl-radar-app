name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version into www
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          # apk 字段必须指向国内可直连的 CDN 版本化文件：旧版 App 的更新器
          # 只会用这个字段下载（github 直连在国内不可达），这是引导旧版完成
          # 自举的唯一通道
          printf '{"code":%s,"version":"%s","apk":"https://gcore.jsdelivr.net/gh/lhw366/ddl-radar-app@main/apk-latest/ddl-radar-%s.apk"}\n' "${{ github.run_number }}" "$V" "${{ github.run_number }}" > www/version.json

      # versionCode 必须随构建递增：写死会导致每次覆盖安装都被系统判定
      # 「相同版本」，ColorOS 每次都要额外确认（用户报障点）
      - name: Stamp versionCode/versionName into gradle
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${V}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 附件必须不以 .apk 结尾：旧版 App 的检查更新若命中 GitHub API，
          # 会取 .apk 附件的 github 直链下载（国内不可达）；找不到 .apk 附件
          # 则自动落到 version.json 的 CDN 直链，保证任何旧版都能自举
          mkdir -p release-asset
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-asset/ddl-radar-${{ github.run_number }}.apk.bin"
          gh release create "v${{ github.run_number }}" "release-asset/ddl-radar-${{ github.run_number }}.apk.bin" \
            --title "DDL雷达 $(cat VERSION | tr -d '[:space:]') · build ${{ github.run_number }}" \
            --notes "自动构建 · 请用 App 内「检查更新」或 Release 说明里的 CDN 直链下载" --repo lhw366/ddl-radar-app \
          || gh release upload "v${{ github.run_number }}" "release-asset/ddl-radar-${{ github.run_number }}.apk.bin" --repo lhw366/ddl-radar-app --clobber

      # 版本化文件名：每个构建都是新文件，CDN 永不可能命中过期缓存
      # （实测 jsdelivr 各边缘对同名文件缓存滞后 1~4 个构建且互不相同，purge 也刷不动）
      - name: Commit version.json + versioned APK (CDN mirror for update)
        run: |
          cp www/version.json version.json
          mkdir -p apk-latest
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-latest/ddl-radar-${N}.apk"
          git config user.name "ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.json "apk-latest/ddl-radar-${N}.apk"
          git commit -m "chore: version.json + versioned apk for build ${N} [skip ci]"
          git push

      - name: Purge jsdelivr version.json cache
        run: |
          curl -s -X POST https://purge.jsdelivr.net/ -H "Content-Type: application/json" \
            -d '{"path":["/gh/lhw366/ddl-radar-app@main/version.json"]}' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDL雷达-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
