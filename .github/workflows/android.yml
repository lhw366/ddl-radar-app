name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version into www
        run: |
          V=$(cat VERSION | tr -d '[:space:]')
          # apk 字段必须指向国内可直连的 CDN 版本化文件：旧版 App 的更新器
          # 只会用这个字段下载（github 直连在国内不可达），这是引导旧版完成
          # 自举的唯一通道
          printf '{"code":%s,"version":"%s","apk":"https://gcore.jsdelivr.net/gh/lhw366/ddl-radar-app@main/apk-latest/ddl-radar-%s.apk"}\n' "${{ github.run_number }}" "$V" "${{ github.run_number }}" > www/version.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "DDL雷达 $(cat VERSION | tr -d '[:space:]') · build ${{ github.run_number }}" \
            --notes "自动构建 · 覆盖安装即可，数据保留" --repo lhw366/ddl-radar-app \
          || gh release upload "v${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --repo lhw366/ddl-radar-app --clobber

      # 版本化文件名：每个构建都是新文件，CDN 永不可能命中过期缓存
      # （实测 jsdelivr 各边缘对同名文件缓存滞后 1~4 个构建且互不相同，purge 也刷不动）
      - name: Commit version.json + versioned APK (CDN mirror for update)
        run: |
          cp www/version.json version.json
          mkdir -p apk-latest
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-latest/ddl-radar-${N}.apk"
          git config user.name "ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add version.json "apk-latest/ddl-radar-${N}.apk"
          git commit -m "chore: version.json + versioned apk for build ${N} [skip ci]"
          git push

      - name: Purge jsdelivr version.json cache
        run: |
          curl -s -X POST https://purge.jsdelivr.net/ -H "Content-Type: application/json" \
            -d '{"path":["/gh/lhw366/ddl-radar-app@main/version.json"]}' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDL雷达-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
