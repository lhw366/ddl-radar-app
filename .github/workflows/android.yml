name: Check, build and release Android

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Stamp one version into web and Android
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          N=${{ github.run_number }}
          printf '{"code":%s,"version":"%s","apk":"https://gcore.jsdelivr.net/gh/lhw366/ddl-radar-app@main/apk-latest/ddl-radar-%s.apk"}\n' "$N" "$V" "$N" > www/version.json
          sed -i "s/versionCode [0-9]*/versionCode $N/; s/versionName \".*\"/versionName \"$V\"/" android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle cloud accounts with public project configuration
        env:
          DDL_SUPABASE_URL: ${{ vars.DDL_SUPABASE_URL }}
          DDL_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DDL_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run cloud:build
      - name: Verify cloud isolation and concurrent update rules in PostgreSQL
        run: npm run test:cloud-db
      - run: npx cap sync android
      - name: Check normal gradients, saves, update prompts and timetable forms
        run: node --test tests/functional-*.cjs
      - name: Build emulator application and instrumentation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebugAndroidTest -PtestAbi=x86_64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual OCR, silent-ringer haptics, DND and normal background reminders
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            DDLR_TEST_RELEASE=1 python3 tests/android_runtime.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: ignore
      - name: Build signed non-debuggable release APK after all checks
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify release signer and reject debuggable production APK
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > release-signature.txt
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk > release-metadata.txt
          if grep -q '^application-debuggable' release-metadata.txt; then echo 'Refusing to publish a debuggable APK'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-verified
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            www/version.json
            release-signature.txt
            release-metadata.txt
          if-no-files-found: error

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-verified
          path: verified
      - name: Prepare versioned APK and metadata
        run: |
          mkdir -p apk-latest release-asset
          N=${{ github.run_number }}
          cp verified/android/app/build/outputs/apk/release/app-release.apk "apk-latest/ddl-radar-$N.apk"
          cp "apk-latest/ddl-radar-$N.apk" "release-asset/ddl-radar-$N.apk.bin"
          cp verified/www/version.json version.json
          git config user.name ci-bot
          git config user.email actions@users.noreply.github.com
          git add version.json "apk-latest/ddl-radar-$N.apk"
          git commit -m "chore: verified build $N [skip ci]"
          git push
      - name: Publish checked build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "v$N" "release-asset/ddl-radar-$N.apk.bin" --title "DDL雷达 $(cat VERSION) · build $N" --notes-file docs/RELEASE.md
      - name: Refresh version metadata cache
        run: |
          curl --fail --max-time 20 -X POST https://purge.jsdelivr.net/ -H 'Content-Type: application/json' -d '{"path":["/gh/lhw366/ddl-radar-app@main/version.json"]}' || true
